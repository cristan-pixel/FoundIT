<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F5FF">
<title>FoundIT — Lost &amp; Found</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg-aura" aria-hidden="true"><span class="aura a1"></span><span class="aura a2"></span><span class="aura a3"></span></div>

<header>
  <a class="logo" href="#home" aria-label="FoundIT home" data-i18n-aria="aria_home">
    <span class="logo-mark"><img src="logo-mark.png" alt=""></span>
    <span class="logo-text"><b class="brand-name">Found<span class="grad">IT</span></b><small>Lost &amp; Found</small></span>
  </a>

  <nav id="nav" aria-label="Main" data-i18n-aria="aria_main">
    <a href="#home" data-i18n="nav_home">Home</a><a href="#board" data-i18n="nav_board">Board</a><a href="#messages" data-i18n="nav_messages">Messages</a>
  </nav>

  <div class="header-actions">
    <label class="who-wrap" title="Demo: view as a different resident" data-i18n-title="aria_view_as_title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c.8-3.4 3.4-5 7-5s6.2 1.6 7 5"/></svg>
      <select class="who" id="who" aria-label="View as resident" data-i18n-aria="aria_view_as" onchange="me=this.value;chat='g';render()"></select>
    </label>
    <label class="lang-wrap" title="Language / English / Tagalog / Bisaya" data-i18n-title="aria_language_title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
      <select class="lang" id="lang" aria-label="Language" data-i18n-aria="aria_language" onchange="setLang(this.value)">
        <option value="en">English</option>
        <option value="tl">Tagalog</option>
        <option value="ceb">Bisaya</option>
      </select>
    </label>
    <button class="circ" id="themeBtn" onclick="theme()" title="Dark / light" aria-label="Toggle dark mode" data-i18n-title="aria_theme_title" data-i18n-aria="aria_theme">
      <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
      <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <button class="btn pri post-btn" id="postBtnHead" onclick="openPost()" aria-label="Post an item" data-i18n-aria="post_item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span class="post-label" data-i18n="post_item">Post an item</span></button>
  </div>
</header>

<main id="app"></main>

<nav class="tabbar" aria-label="Mobile navigation" data-i18n-aria="aria_mobile_nav">
  <a href="#home" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-7 9 7v9a2 2 0 0 1-2 2h-4v-6H9v6H5a2 2 0 0 1-2-2v-9Z"/></svg><span data-i18n="nav_home">Home</span></a>
  <a href="#board" data-tab="board"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg><span data-i18n="nav_board">Board</span></a>
  <a href="#messages" data-tab="messages"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8 8 0 0 1-8.5 8L7 21l1-3.5A8 8 0 1 1 21 11.5Z"/></svg><span data-i18n="nav_messages">Messages</span></a>
  <button class="post-tab" onclick="openPost()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span data-i18n="post_short">Post</span></button>
</nav>

<div id="m" onclick="if(event.target==this)closeM()"></div>
<div id="t" role="status" aria-live="polite"></div>
<script src="script.js"></script>
</body>
</html>
